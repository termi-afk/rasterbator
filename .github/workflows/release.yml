name: Release

# Builds and packages the executables for common systems and publishes a
# GitHub release when a version tag (e.g. "0.1.0" or "v0.1.0") is pushed.
on:
  push:
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libx11-dev libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item README.md, LICENSE dist/
          Copy-Item target/${{ matrix.target }}/release/rasterbator.exe dist/
          Copy-Item target/${{ matrix.target }}/release/rasterbator-gui.exe dist/
          Compress-Archive -Path dist/* -DestinationPath rasterbator-${{ env.VERSION }}-${{ matrix.name }}.zip

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp README.md LICENSE dist/
          cp target/${{ matrix.target }}/release/rasterbator dist/
          cp target/${{ matrix.target }}/release/rasterbator-gui dist/
          tar -C dist -czf rasterbator-${VERSION}-${{ matrix.name }}.tar.gz .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rasterbator-${{ matrix.name }}
          path: rasterbator-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
